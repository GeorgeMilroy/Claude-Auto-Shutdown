<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Auto Shutdown: dashboard harness</title>
    <link rel="stylesheet" href="/harness.css" />
  </head>
  <body>
    <aside class="controls">
      <h1>Dashboard harness</h1>
      <p class="hint">Synthetic states only. Nothing here can touch this PC.</p>
      <label for="fixture">State</label>
      <select id="fixture"></select>
      <label for="theme">Theme</label>
      <select id="theme"></select>
      <label for="surface">Hosted in</label>
      <select id="surface"></select>
      <label for="width">Width</label>
      <select id="width"></select>
      <label class="check"><input type="checkbox" id="motion" /> Reduce motion</label>
      <div class="buttons">
        <button type="button" id="reload">Reopen webview</button>
        <button type="button" id="focus-plan">Host: focusPlan</button>
      </div>
      <h2>Messages to the host <button type="button" id="clear-log">Clear</button></h2>
      <ol id="log"></ol>
    </aside>
    <main class="stage">
      <iframe id="frame" title="Dashboard"></iframe>
    </main>
    <script src="/harness.js"></script>
  </body>
</html>
